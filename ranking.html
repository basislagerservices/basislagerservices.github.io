    <div class="container">
      <div class="text-center mt-5">
        <h1>Ticker-Basislager</h1>
        <noscript>
          <p style="background: orangered">JavaScript aktivieren, sonst wird das wahrscheinlich nichts!</p>
        </noscript>
        <p class="lead" id="ranking-header">Rangliste</p>

        <div class="container mt-5">
          <!-- Nav tabs -->
          <ul class="nav nav-tabs" id="myTab">
            <li class="nav-item">
              <a class="nav-link active" id="postings-tab" data-bs-toggle="tab" href="#postings">Postings</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="green-total-tab" data-bs-toggle="tab" href="#green-total">Grün (erhalten)</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="red-total-tab" data-bs-toggle="tab" href="#red-total">Rot (erhalten)</a>
            </li>
          </ul>

          <!-- Tab panes -->
          <div class="tab-content">
            <div class="tab-pane fade show active" id="postings">
              <table class="table" id="postings-table">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Postings</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="tab-pane fade" id="green-total">
              <table class="table" id="green-total-table">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Stricherl</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div class="tab-pane fade" id="red-total">
              <table class="table" id="red-total-table">
                <thead>
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Stricherl</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      // Users ignored in the ranking (by name).
      const hiddenUsers = []

      const rankingPath = 'https://raw.githubusercontent.com/basislagerservices/data/main/ranking/ranking.json'
      const deletedPath = 'https://raw.githubusercontent.com/basislagerservices/data/main/ranking/deleted.json'
      const deletedAutoPath = 'https://raw.githubusercontent.com/basislagerservices/data/main/ranking/deleted-auto.json'
      const aliasesPath = 'https://raw.githubusercontent.com/basislagerservices/data/main/ranking/user-aliases.txt'

      const ranking = await (await fetch(rankingPath)).json()
      const deletedManual = await (await fetch(deletedPath)).json()
      const deletedAuto = await (await fetch(deletedAutoPath)).json()
      const deleted = { ...deletedManual, ...deletedAuto }
      const aliases = (await (await fetch(aliasesPath)).text())
        .split('\n\n')
        .map((s) => s.split('\n').filter((s) => s))
        .filter((g) => g)

      // Create a one-to-many alias index.
      const aliasIndex = {}
      for (const group of aliases) {
        for (const name of group) {
          aliasIndex[name] = group.filter((x) => x !== name)
        }
      }

      let dateInfo = ' (' + ranking['date'] + ')'
      document.querySelector('#ranking-header').insertAdjacentHTML('beforeend', dateInfo)

      // Create the i-th entry row the ranking.
      // This function takes the index i, the ranked data and a function to extract
      // the value to display from the entry.
      // It returns the entire row between <tr> tags.
      function createRow(i, data, value_func) {
        const rankEntry = '<td>' + (i + 1) + '</td>'
        const entry = data[i]
        const id = entry['id']
        let name = entry['name']

        // Check if the user was deleted.
        let fontClass = ''
        if (name == 'gelöschter User') {
          fontClass = 'class="table-danger"'
          if (id in deleted) name = deleted[id]
        }

        // Create the name entry with aliases.
        const nameEntry = document.createElement('td')
        nameEntry.style.wordBreak = 'break-word'
        const summary = document.createElement('summary')
        summary.style.listStyle = 'none'
        summary.textContent = name
        const content = document.createElement('div')
        content.style.fontStyle = 'italic'
        content.style.fontSize = 'small'
        if (aliasIndex[name]) {
          for (const alias of aliasIndex[name]) {
            content.append(alias, document.createElement('br'))
          }
        } else {
          summary.style.cursor = 'default'
        }

        const details = document.createElement('details')
        details.append(summary, content)
        nameEntry.append(details)

        const valueEntry = '<td>' + value_func(entry) + '</td>'

        return '<tr ' + fontClass + '>' + rankEntry + nameEntry.outerHTML + valueEntry + '</tr>'
      }

      // Create sorted rankings.
      let postings = ranking['users'].toSorted(function (first, second) {
        return second['postings'] - first['postings']
      })
      let green_total = ranking['users'].toSorted(function (first, second) {
        return second['upvotes'] - first['upvotes']
      })
      let red_total = ranking['users'].toSorted(function (first, second) {
        return second['downvotes'] - first['downvotes']
      })

      // Remove users who don't want to show up in the ranking.
      postings = postings.filter((e) => !hiddenUsers.includes(e.name))
      green_total = green_total.filter((e) => !hiddenUsers.includes(e.name))
      red_total = red_total.filter((e) => !hiddenUsers.includes(e.name))

      // Add rankings to tables.
      for (let i = 0; i < postings.length; i++) {
        const row = createRow(i, postings, function (e) {
          return e['postings']
        })
        document.querySelector('#postings-table > tbody:last-child').insertAdjacentHTML('beforeend', row)
      }
      for (let i = 0; i < green_total.length; i++) {
        const row = createRow(i, green_total, function (e) {
          return e['upvotes']
        })
        document.querySelector('#green-total-table > tbody:last-child').insertAdjacentHTML('beforeend', row)
      }
      for (let i = 0; i < red_total.length; i++) {
        const row = createRow(i, red_total, function (e) {
          return e['downvotes']
        })
        document.querySelector('#red-total-table > tbody:last-child').insertAdjacentHTML('beforeend', row)
      }
    </script>
