<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickerquarium</title>
    <link href="assets/aquarium.png" rel="icon" type="image/x-icon" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #002244, #000820);
        height: 100%;
        width: 100%;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #aaf;
        background: rgba(0, 0, 30, 0.4);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="aquarium"></canvas>
    <div id="info">💬 Tickerquarium: Wer postet, schwimmt!</div>

    <script type="module">
      import * as utils from './js/aquarium/utils.js'
      import { Ticker } from './js/aquarium/ticker.js'
      import { DEFAULT_FACES } from './js/aquarium/aquarium.js'

      const canvas = document.getElementById('aquarium')
      const ctx = canvas.getContext('2d')

      const users = {}
      const INACTIVITY_LIMIT = 3600 * 1000

      let lastWidth = window.innerWidth
      let lastHeight = window.innerHeight

      function resize() {
        const newWidth = window.innerWidth
        const newHeight = window.innerHeight

        // Scale fish positions to new size
        const scaleX = newWidth / lastWidth
        const scaleY = newHeight / lastHeight

        for (const fish of Object.values(users)) {
          fish.x *= scaleX
          fish.y *= scaleY
        }

        canvas.width = newWidth
        canvas.height = newHeight
        lastWidth = newWidth
        lastHeight = newHeight
      }

      window.addEventListener('resize', resize)
      resize()

      function drawFish(fish) {
        const color = `hsl(${fish.color}, 70%, 60%)`
        ctx.save()
        ctx.translate(fish.x, fish.y)
        ctx.scale(fish.direction, 1)

        // Draw body
        ctx.fillStyle = color
        ctx.beginPath()
        ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2)
        ctx.fill()

        // Tail
        ctx.beginPath()
        ctx.moveTo(-20, 0)
        ctx.lineTo(-30, -10)
        ctx.lineTo(-30, 10)
        ctx.closePath()
        ctx.fill()

        // Optional glow for recent activity
        const glowStrength = Math.max(0, 1 - (Date.now() - fish.lastActive) / 5000)
        if (glowStrength > 0) {
          ctx.shadowColor = color
          ctx.shadowBlur = 15 * glowStrength
          ctx.beginPath()
          ctx.arc(0, 0, 10 + 10 * glowStrength, 0, Math.PI * 2)
          ctx.fill()
          ctx.shadowBlur = 0
        }

        ctx.restore()

        // Add the face.
        ctx.font = '28px sans-serif'
        ctx.textAlign = 'center'
        ctx.fillStyle = 'rgba(255, 255, 255, 1.00)'
        ctx.fillText(fish.face, fish.x + fish.direction * 25, fish.y + 8)

        // --- Draw username label ---
        ctx.font = '14px sans-serif'
        ctx.textAlign = 'center'
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'
        ctx.fillText(fish.name, fish.x, fish.y - 18) // draw above the fish
      }
      function animateFish() {
        const now = Date.now()

        for (const [name, fish] of Object.entries(users)) {
          const inactive = now - fish.lastActive > INACTIVITY_LIMIT

          if (inactive) {
            // Swim off-screen slowly
            fish.x += fish.direction * 1.5
            if (fish.x < -60 || fish.x > canvas.width + 60) {
              delete users[name]
              continue
            }
          } else {
            // Swim pattern
            fish.x += fish.direction * fish.speed
            fish.y += Math.sin(Date.now() / 700 + fish.offset) * 0.5

            // Bounce off walls
            if (fish.x < 30) fish.direction = 1
            if (fish.x > canvas.width - 30) fish.direction = -1

            fish.y = Math.min(Math.max(30, fish.y), canvas.height - 30)
          }

          // At 60 fps, it takes 10 minutes for the entire spectrum.
          if (fish.name == 'WS+') {
            fish.color = (fish.color + 1.0) % 360
          } else {
            fish.color = (fish.color + 0.01) % 360
          }

          drawFish(fish)
        }
      }

      const snowflakes = []

      // Create random snowflake objects
      function createSnowflakes(count = 150) {
        for (let i = 0; i < count; i++) {
          snowflakes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 28 + 10, // emoji pixel size
            speedY: Math.random() * 1 + 0.5, // vertical speed
            speedX: Math.random() * 0.8 - 0.4, // horizontal drift
            emoji: '❄️',
          })
        }
      }

      function drawSnowflake(flake) {
        ctx.font = `${flake.size}px serif`
        ctx.fillText(flake.emoji, flake.x, flake.y)
      }

      function animateSnowflakes() {
        for (const flake of snowflakes) {
          drawSnowflake(flake)

          flake.y += flake.speedY
          flake.x += flake.speedX

          // Wrap when passing bottom
          if (flake.y > canvas.height + flake.size) {
            flake.y = -flake.size
            flake.x = Math.random() * canvas.width
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)

        animateSnowflakes()
        animateFish()
        requestAnimationFrame(animate)
      }

      function randomElement(array) {
        return array[Math.floor(Math.random() * array.length)]
      }

      function handlePost(user, lastActive = null) {
        if (lastActive === null) lastActive = Date.now()
        else if (lastActive < Date.now() - INACTIVITY_LIMIT) return

        console.log(user)

        if (!users[user]) {
          users[user] = {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            direction: Math.random() < 0.5 ? 1 : -1,
            color: Math.random() * 360,
            offset: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 0.5,
            lastActive: lastActive,
            name: user,
            face: randomElement(DEFAULT_FACES),
          }
        } else {
          users[user].lastActive = Math.max(lastActive, users[user].lastActive)
        }
      }

      const TICKER_ID = 3000000299289
      const CORS_PROXY = utils.isDebugSession() ? 'http://0.0.0.0:8080/' : 'https://basislager-service.onrender.com/'
      const HISTORY_POSTINGS = 300

      let ticker = new Ticker(TICKER_ID, {
        initPostings: HISTORY_POSTINGS,
        initThreads: 2,
        corsProxy: CORS_PROXY,
        sessionId: utils.createSessionId(),
      })
      ticker.onposting = (p) => {
        handlePost(p.user, p.published.getTime())
      }

      animate()
      createSnowflakes(30)
      await ticker.connect()
    </script>
  </body>
</html>
