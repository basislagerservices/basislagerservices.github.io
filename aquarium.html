<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickerquarium</title>
    <link href="assets/aquarium.png" rel="icon" type="image/x-icon" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #002244, #000820);
        height: 100%;
        width: 100%;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #aaf;
        background: rgba(0, 0, 30, 0.4);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="aquarium"></canvas>
    <script type="module">
      import { TickerAnimation } from './js/aquarium/animation.js'
      import { isDebugSession } from './js/common/utils.js'
      import { FishLayer } from './js/aquarium/fish.js'
      import { SnowLayer } from './js/aquarium/snow.js'
      import { BubbleLayer } from './js/aquarium/bubbles.js'
      import { JumpEmojiLayer } from './js/aquarium/jumpemoji.js'
      import { PlecoLayer } from './js/aquarium/pleco.js'

      // Default values.
      let tickerId = 3000000330248
      let jumpEmoji = '🌻'
      let initThreads = 2
      let initPostings = 300
      let timeoutWindow = 3600

      // Maximum values
      const MAX_INIT_THREADS = 100
      const MAX_INIT_POSTINGS = 1000

      let urlParams = new URLSearchParams(document.location.search)
      if (urlParams.get('ticker')) tickerId = urlParams.get('ticker')
      if (urlParams.get('jumpemoji')) jumpEmoji = urlParams.get('jumpemoji')
      if (urlParams.get('initthreads')) {
        initThreads = parseInt(urlParams.get('initthreads')) || initThreads
        initThreads = Math.min(initThreads, MAX_INIT_THREADS)
      }
      if (urlParams.get('initpostings')) {
        initPostings = parseInt(urlParams.get('initpostings')) || initPostings
        initPostings = Math.min(initPostings, MAX_INIT_POSTINGS)
      }
      if (urlParams.get('timeout')) timeoutWindow = parseInt(urlParams.get('timeout')) || timeout

      const CORS_PROXY = isDebugSession() ? 'http://0.0.0.0:8080/' : 'https://basislager-service.onrender.com/'
      const canvas = document.getElementById('aquarium')
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight

      // prettier-ignore
      const layers = [
        //new SnowLayer(canvas, 30),
        new BubbleLayer(canvas, 30),
        new JumpEmojiLayer(canvas, jumpEmoji),
        new FishLayer(canvas, timeoutWindow * 1000),
        new PlecoLayer(canvas),
      ]
      let aquarium = new TickerAnimation(canvas, tickerId, layers, {
        corsProxy: CORS_PROXY,
        initThreads: initThreads,
        initPostings: initPostings,
      })
      await aquarium.start()
    </script>
  </body>
</html>
