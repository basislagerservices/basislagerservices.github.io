<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickerquarium</title>
    <link href="assets/aquarium.png" rel="icon" type="image/x-icon" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #002244, #000820);
        height: 100%;
        width: 100%;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #aaf;
        background: rgba(0, 0, 30, 0.4);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="aquarium"></canvas>
    <script type="module">
      import { TickerAnimation } from './js/aquarium/animation.js'
      import { isDebugSession } from './js/aquarium/utils.js'
      import { FishLayer } from './js/aquarium/fish.js'
      import { SnowLayer } from './js/aquarium/snow.js'

      const TICKER_ID = 3000000299289
      const CORS_PROXY = isDebugSession() ? 'http://0.0.0.0:8080/' : 'https://basislager-service.onrender.com/'
      const canvas = document.getElementById('aquarium')
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight

      // prettier-ignore
      const layers = [
        new SnowLayer(canvas, 30),
        new FishLayer(canvas, 3600 * 1000),
      ]
      let aquarium = new TickerAnimation(canvas, TICKER_ID, layers, { corsProxy: CORS_PROXY })
      await aquarium.start()
    </script>
  </body>
</html>
