<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
    <meta name="description" content="Aktuelle Wetterdaten aus Österreich, Deutschland und der Schweiz" />
    <title>Basislager-Wetter</title>
    <link href="assets/favicon.png" rel="icon" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #map {
        height: 100%;
        width: 100%;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: rgba(33, 37, 41, 0.92);
        border: 1px solid #495057;
        border-radius: 6px;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      #controls .btn-outline-light {
        --bs-btn-color: #9eaab8;
        --bs-btn-border-color: #495057;
        --bs-btn-hover-bg: #495057;
        --bs-btn-hover-color: #ced4da;
        --bs-btn-active-bg: #ff7800;
        --bs-btn-active-border-color: #ff7800;
        --bs-btn-active-color: #fff;
      }
      #controls .btn-check:checked + .btn-outline-light {
        background-color: #ff7800;
        border-color: #ff7800;
        color: #fff;
      }
      #controls #refresh-btn {
        --bs-btn-color: #9eaab8;
      }
      #controls #refresh-btn:hover {
        --bs-btn-color: #ced4da;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      #refresh-btn.spinning {
        animation: spin 1s linear infinite;
      }
      .station-popup {
        min-width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .station-popup h3 {
        margin: 0 0 4px 0;
        font-size: 14px;
      }
      .station-popup .current {
        font-size: 18px;
        font-weight: 700;
        color: #ff7800;
      }
      .station-popup .sparkline {
        margin-top: 6px;
      }
      .station-popup .sparkline svg {
        display: block;
      }
      .station-popup .sparkline text {
        font-size: 9px;
        fill: #666;
      }
      .spark-overlay {
        cursor: crosshair;
      }
      #spark-tooltip {
        display: none;
        position: absolute;
        z-index: 10000;
        pointer-events: none;
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 11px;
        font-family: monospace;
        white-space: nowrap;
        transform: translate(-50%, -100%);
        margin-top: -6px;
      }
      #search-box {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 1001;
        width: 240px;
        display: flex;
        flex-direction: column-reverse;
      }
      #station-search {
        width: 100%;
        padding: 11px 12px;
        border-radius: 8px;
        border: none;
        background: rgba(33, 37, 41, 0.85);
        color: #fff;
        font-size: 14px;
        line-height: 1.5;
        outline: none;
        box-sizing: border-box;
      }
      #station-search::placeholder {
        color: #6c757d;
      }
      #station-search:focus {
        outline: 2px solid #ff7800;
        outline-offset: -1px;
      }
      #search-results {
        max-height: 300px;
        overflow-y: auto;
        margin-bottom: 4px;
        border-radius: 8px;
        background: rgba(33, 37, 41, 0.92);
        border: 1px solid #495057;
      }
      #search-results:empty {
        display: none;
      }
      .sidebar-resize-handle {
        position: absolute;
        left: -4px;
        top: 0;
        bottom: 0;
        width: 8px;
        cursor: col-resize;
        z-index: 10;
      }
      .sidebar-resize-handle::after {
        content: '';
        position: absolute;
        left: 3px;
        top: 0;
        bottom: 0;
        width: 2px;
        transition: background 0.15s;
      }
      .sidebar-resize-handle:hover::after {
        background: #ff7800;
      }
      #temp-sidebar {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        width: 300px;
        bottom: 10px;
        border-radius: 6px;
        background: rgba(33, 37, 41, 0.92);
        border: 1px solid #495057;
        display: flex;
        flex-direction: column;
      }
      #temp-sidebar:empty {
        display: none;
      }
      #temp-sidebar.collapsed {
        bottom: auto;
      }
      #temp-sidebar.collapsed #temp-sidebar-list {
        display: none;
      }
      .temp-sidebar-header {
        padding: 4px 8px;
        font-size: 13px;
        font-weight: 600;
        color: #9eaab8;
        border-bottom: 1px solid #495057;
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
        display: grid;
        grid-template-columns: 1fr 30px 56px 52px;
        align-items: center;
        gap: 4px;
      }
      .temp-sidebar-header:hover {
        color: #ced4da;
      }
      .temp-sidebar-sorts {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .sort-btn {
        cursor: pointer;
        padding: 0 2px;
        border-radius: 3px;
        font-size: 11px;
        color: #9eaab8;
        text-align: center;
      }
      .sort-btn:hover {
        color: #ced4da;
        background: #495057;
      }
      .sort-btn.active {
        color: #ff7800;
        font-weight: 700;
      }
      .alpha-btn {
        cursor: pointer;
        font-size: 12px;
        margin-right: 6px;
        display: inline-block;
        min-width: 26px;
        text-align: center;
      }
      .alpha-btn:hover {
        opacity: 0.7;
      }
      .alpha-btn.active {
        color: #ff7800;
        font-weight: 700;
      }
      #temp-sidebar-list {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: #495057 transparent;
      }
      #temp-sidebar-list:empty {
        display: none;
      }
      #temp-sidebar-list::-webkit-scrollbar {
        width: 6px;
      }
      #temp-sidebar-list::-webkit-scrollbar-track {
        background: transparent;
      }
      #temp-sidebar-list::-webkit-scrollbar-thumb {
        background: #495057;
        border-radius: 3px;
      }
      #temp-sidebar-list::-webkit-scrollbar-thumb:hover {
        background: #6c757d;
      }
      .temp-sidebar-item {
        padding: 3px 8px;
        cursor: pointer;
        font-size: 12px;
        color: #ced4da;
        display: grid;
        grid-template-columns: 1fr 30px 56px 52px;
        align-items: center;
        gap: 4px;
      }
      .temp-sidebar-item:hover {
        background: #495057;
        color: #fff;
      }
      .temp-sidebar-item .temp-val,
      .temp-sidebar-item .precip-val {
        font-weight: 700;
        justify-self: end;
      }
      .temp-sidebar-item .temp-val {
        color: #ff7800;
      }
      .temp-sidebar-item .precip-val {
        color: #6ea8fe;
        font-size: 11px;
      }
      .temp-sidebar-item .source-tag {
        font-size: 10px;
        color: #9eaab8;
        text-align: right;
      }
      .search-result-item {
        padding: 4px 8px;
        cursor: pointer;
        font-size: 12px;
        color: #adb5bd;
        display: flex;
        justify-content: space-between;
        align-items: center;
        overflow: hidden;
      }
      .search-result-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .search-result-item:hover,
      .search-result-item.active {
        background: #495057;
        color: #fff;
      }
      .search-result-item .source-tag {
        font-size: 10px;
        color: #6c757d;
        flex-shrink: 0;
        margin-left: 8px;
      }
      .search-result-separator {
        padding: 2px 8px;
        font-size: 10px;
        color: #6c757d;
        border-top: 1px solid #495057;
        margin-top: 2px;
        cursor: default;
      }
      .marker-temp-label {
        background: rgba(33, 37, 41, 0.85);
        border: none;
        color: #ff7800;
        font-size: 12px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        white-space: nowrap;
        box-shadow: none;
      }
      .marker-temp-label::before {
        display: none;
      }
      @media (min-width: 769px) {
        #controls {
          left: auto;
          right: 10px;
          transform: none;
          width: 300px;
          min-width: 0;
          box-sizing: border-box;
        }
        #controls > * {
          min-width: 0;
          flex-shrink: 1;
        }
        #temp-sidebar {
          top: 56px;
        }
      }
      #toast-container {
        position: fixed;
        bottom: 20px;
        right: 10px;
        z-index: 10000;
        display: flex;
        flex-direction: column-reverse;
        gap: 6px;
        max-width: 360px;
      }
      .toast-error {
        background: rgba(33, 37, 41, 0.95);
        border: 1px solid #dc3545;
        color: #f8d7da;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 20px;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        animation: toast-in 0.2s ease-out;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .toast-error .toast-close {
        cursor: pointer;
        color: #dc3545;
        font-size: 14px;
        line-height: 1;
        margin-left: auto;
        flex-shrink: 0;
      }
      @media (max-width: 768px) {
        #controls {
          left: 0;
          right: 0;
          transform: none;
          width: 320px;
          max-width: calc(100vw - 20px);
          margin: 0 auto;
        }
        #controls > * {
          min-width: 0;
          flex-shrink: 1;
        }
        #controls .btn {
          padding-left: 6px;
          padding-right: 6px;
        }
        #temp-sidebar {
          top: 62px;
          left: 0;
          right: 0;
          transform: none;
          bottom: auto;
          max-height: 50vh;
          width: 320px;
          max-width: calc(100vw - 20px);
          margin: 0 auto;
        }
        .sidebar-resize-handle {
          display: none;
        }
      }
    </style>
  </head>

    <div id="map">
      <div id="controls">
        <div class="d-flex gap-1">
          <input type="checkbox" class="btn-check" id="source-at" autocomplete="off" />
          <label class="btn btn-sm btn-outline-light" for="source-at">Österreich</label>

          <label class="btn btn-sm btn-outline-light" for="source-de">Deutschland</label>

      <div id="temp-sidebar">
        <div class="sidebar-resize-handle"></div>
        <div class="temp-sidebar-header">
          <span><span class="alpha-btn" title="Alphabetisch sortieren">A</span> Stationen</span>
          <span></span>
          <span class="sort-btn active" data-sort="temp">T ▾</span>
          <span class="sort-btn" data-sort="precip">N</span>
        </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <div id="spark-tooltip"></div>
    <div id="toast-container"></div>
    <script type="module">
      import { isDebugSession, createSessionId } from './js/common/utils.js'

      const sparklineDataMap = new Map()

      const pad = (n) => String(n).padStart(2, '0')

      function showToast(message) {
        const container = document.getElementById('toast-container')
        const toast = document.createElement('div')
        toast.className = 'toast-error'
        toast.innerHTML = `<span>${message}</span><span class="toast-close">&times;</span>`
        toast.querySelector('.toast-close').addEventListener('click', () => toast.remove())
        setTimeout(() => {
          toast.style.opacity = '0'
          toast.style.transition = 'opacity 0.2s'
          setTimeout(() => toast.remove(), 200)
        }, 30000)
        container.appendChild(toast)
        while (container.children.length > 3) {
          container.firstChild.remove()
        }
      }

      const stationLookup = []
      const stationTempList = []

      function registerStation(name, lat, lon, marker, source) {
        stationLookup.push({ name, lat, lon, marker, source })
      }

      function clearStationLookup() {
        stationLookup.length = 0
      }

      function clearStationTempList() {
        stationTempList.length = 0
      }

      let activeSortMetric = 'temp'
      let sortState = 0
      let alphaActive = false
      let alphaDir = 'asc'

      function getSortConfig() {
        if (alphaActive) return { metric: 'alpha', dir: alphaDir }
        return { metric: activeSortMetric, dir: sortState === 0 ? 'desc' : 'asc' }
      }

      function renderTempSidebar() {
        const { metric, dir } = getSortConfig()
        const sorted = [...stationTempList].sort((a, b) => {
          if (metric === 'alpha') {
            const cmp = a.name.localeCompare(b.name)
            return dir === 'desc' ? -cmp : cmp
          }
          const va = a[metric] ?? -Infinity
          const vb = b[metric] ?? -Infinity
          return dir === 'desc' ? vb - va : va - vb
        })
        if (sorted.length === 0) {
          tempSidebarList.replaceChildren()
          return
        }
        const fragment = document.createDocumentFragment()
        sorted.forEach((s) => {
          const div = document.createElement('div')
          div.className = 'temp-sidebar-item'
          const tempStr = s.temp != null ? `<span class="temp-val">${s.temp.toFixed(1)}°C</span>` : '<span class="temp-val">—</span>'
          const precipStr = s.precip != null ? `<span class="precip-val">${s.precip.toFixed(1)}mm</span>` : '<span class="precip-val">—</span>'
          div.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${s.name.replace(/"/g, '&quot;')}">${s.name}</span><span class="source-tag">${s.source}</span>${tempStr}${precipStr}`
          div.addEventListener('click', () => {
            markers.zoomToShowLayer(s.marker, () => {
              s.marker.openPopup()
            })
          })
          fragment.appendChild(div)
        })
        tempSidebarList.replaceChildren(fragment)
      }

      const searchInput = document.getElementById('station-search')
      const searchResults = document.getElementById('search-results')
      L.DomEvent.disableClickPropagation(searchInput)
      L.DomEvent.disableClickPropagation(searchResults)
      L.DomEvent.disableScrollPropagation(searchResults)
      const tempSidebar = document.getElementById('temp-sidebar')
      const tempSidebarList = document.getElementById('temp-sidebar-list')
      L.DomEvent.disableClickPropagation(tempSidebar)
      L.DomEvent.disableScrollPropagation(tempSidebarList)

      const savedCollapsed = localStorage.getItem('tempSidebarCollapsed') === 'true'
      if (savedCollapsed) tempSidebar.classList.add('collapsed')
      const savedWidth = parseInt(localStorage.getItem('tempSidebarWidth'))
      let lastDesktopWidth = savedWidth || 300
      if (savedWidth && window.innerWidth > 768) {
        tempSidebar.style.width = savedWidth + 'px'
        document.getElementById('controls').style.width = savedWidth + 'px'
      }

      window.addEventListener('resize', () => {
        if (window.innerWidth <= 768) {
          if (tempSidebar.style.width) lastDesktopWidth = parseInt(tempSidebar.style.width)
          tempSidebar.style.width = ''
          document.getElementById('controls').style.width = ''
        } else {
          if (!tempSidebar.style.width) {
            tempSidebar.style.width = lastDesktopWidth + 'px'
            document.getElementById('controls').style.width = lastDesktopWidth + 'px'
          }
        }
      })

      const resizeHandle = tempSidebar.querySelector('.sidebar-resize-handle')
      let resizing = false
      let startX, startWidth
      resizeHandle.addEventListener('mousedown', (e) => {
        e.preventDefault()
        e.stopPropagation()
        resizing = true
        startX = e.clientX
        startWidth = tempSidebar.offsetWidth
        document.body.style.cursor = 'col-resize'
        document.body.style.userSelect = 'none'
      })
      document.addEventListener('mousemove', (e) => {
        if (!resizing) return
        const delta = startX - e.clientX
        const newWidth = Math.max(200, Math.min(600, startWidth + delta))
        tempSidebar.style.width = newWidth + 'px'
        document.getElementById('controls').style.width = newWidth + 'px'
      })
      document.addEventListener('mouseup', () => {
        if (!resizing) return
        resizing = false
        document.body.style.cursor = ''
        document.body.style.userSelect = ''
        if (window.innerWidth > 768) localStorage.setItem('tempSidebarWidth', tempSidebar.offsetWidth)
      })
      document.querySelector('.temp-sidebar-header').addEventListener('click', (e) => {
        if (e.target.closest('.sort-btn') || e.target.closest('.alpha-btn')) return
        tempSidebar.classList.toggle('collapsed')
        localStorage.setItem('tempSidebarCollapsed', tempSidebar.classList.contains('collapsed'))
      })

      function updateSortBtnLabels() {
        const states = ['▾', '▴']
        sortBtns.forEach((b) => {
          b.classList.toggle('active', !alphaActive && b.dataset.sort === activeSortMetric)
          const label = b.dataset.sort === 'temp' ? 'T' : 'N'
          const active = !alphaActive && b.dataset.sort === activeSortMetric ? states[sortState] : ''
          b.textContent = `${label} ${active}`
        })
        const alphaBtn = document.querySelector('.alpha-btn')
        if (alphaActive) {
          alphaBtn.textContent = alphaDir === 'desc' ? 'A ▾' : 'A ▴'
        } else {
          alphaBtn.textContent = 'A'
        }
        alphaBtn.classList.toggle('active', alphaActive)
      }

      document.querySelector('.alpha-btn').addEventListener('click', (e) => {
        e.stopPropagation()
        alphaActive = true
        alphaDir = alphaDir === 'asc' ? 'desc' : 'asc'
        updateSortBtnLabels()
        renderTempSidebar()
      })
      const sortBtns = document.querySelectorAll('.sort-btn')
      sortBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const metric = btn.dataset.sort
          alphaActive = false
          if (activeSortMetric === metric) {
            sortState = sortState === 0 ? 1 : 0
          } else {
            activeSortMetric = metric
            sortState = 0
          }
          updateSortBtnLabels()
          renderTempSidebar()
        })
      })
      updateSortBtnLabels()
      let searchActiveIndex = -1
      let locationDebounceTimer = null
      let currentLocations = []
      let currentStations = []

      function buildStationItem(s, idx) {
        const div = document.createElement('div')
        div.className = 'search-result-item'
        div.dataset.type = 'station'
        div.dataset.idx = idx
        div.innerHTML = `<span>${s.name}</span><span class="source-tag">${s.source}</span>`
        div.addEventListener('mousedown', (e) => {
          e.preventDefault()
          selectStation(s)
        })
        div.addEventListener('mouseenter', () => {
          searchActiveIndex = idx
          updateHighlight()
        })
        return div
      }

      function buildLocationItem(loc, idx) {
        const div = document.createElement('div')
        div.className = 'search-result-item'
        div.dataset.type = 'location'
        div.dataset.idx = idx
        div.innerHTML = `<span>&#x1f4cd; ${loc.display_name}</span>`
        div.addEventListener('mousedown', (e) => {
          e.preventDefault()
          selectLocation(loc)
        })
        div.addEventListener('mouseenter', () => {
          searchActiveIndex = idx
          updateHighlight()
        })
        return div
      }

      function buildSeparator() {
        const div = document.createElement('div')
        div.className = 'search-result-separator'
        div.textContent = 'Orte'
        div.dataset.type = 'separator'
        return div
      }

      function updateHighlight() {
        const items = searchResults.querySelectorAll('.search-result-item')
        items.forEach((item) => {
          const idx = parseInt(item.dataset.idx)
          item.classList.toggle('active', idx === searchActiveIndex)
        })
      }

      function selectLocation(loc) {
        searchInput.value = ''
        searchResults.replaceChildren()
        searchInput.blur()
        if (locationDebounceTimer) clearTimeout(locationDebounceTimer)
        map.setView([parseFloat(loc.lat), parseFloat(loc.lon)], 12)
      }

      function renderSearchResults(stations, locations) {
        currentStations = stations
        currentLocations = locations
        searchActiveIndex = -1
        const fragment = document.createDocumentFragment()
        let flatIdx = 0

        stations.forEach((s) => {
          const div = buildStationItem(s, flatIdx++)
          fragment.appendChild(div)
        })

        if (locations.length > 0) {
          fragment.appendChild(buildSeparator())
          locations.forEach((loc) => {
            const div = buildLocationItem(loc, flatIdx++)
            fragment.appendChild(div)
          })
        }

        if (stations.length === 0 && locations.length === 0) {
          const div = document.createElement('div')
          div.className = 'search-result-item'
          div.style.cursor = 'default'
          div.style.color = '#6c757d'
          div.textContent = 'Keine Ergebnisse'
          fragment.appendChild(div)
        }

        searchResults.replaceChildren(fragment)
      }

      function doSearch() {
        const query = searchInput.value.trim()
        if (!query) {
          searchResults.replaceChildren()
          searchActiveIndex = -1
          return
        }
        const lower = query.toLowerCase()
        const stations = stationLookup.filter((s) => s.name.toLowerCase().includes(lower)).slice(0, 5)
        renderSearchResults(stations, [])
        fetchLocationsDebounced(query, stations.length)
      }

      function fetchLocationsDebounced(query, stationCount) {
        if (locationDebounceTimer) clearTimeout(locationDebounceTimer)
        locationDebounceTimer = setTimeout(() => fetchLocations(query, stationCount), 300)
      }

      async function fetchLocations(query, stationCount) {
        try {
          const url =
            'https://nominatim.openstreetmap.org/search' +
            `?q=${encodeURIComponent(query)}` +
            '&format=json&limit=3&countrycodes=at,de,ch,li' +
            '&accept-language=de'
          const res = await fetch(url)
          if (!res.ok) return
          const locations = await res.json()
          if (!searchInput.value.trim().toLowerCase().includes(query.toLowerCase())) return

          const lower = query.toLowerCase()
          const stations = stationLookup.filter((s) => s.name.toLowerCase().includes(lower)).slice(0, 5)
          renderSearchResults(stations, locations)
        } catch {
          // ignore geocoding errors
        }
      }

      function selectStation(station) {
        searchInput.value = ''
        searchResults.replaceChildren()
        searchInput.blur()
        if (locationDebounceTimer) clearTimeout(locationDebounceTimer)
        markers.zoomToShowLayer(station.marker, () => {
          station.marker.openPopup()
        })
      }

      searchInput.addEventListener('input', doSearch)
      searchInput.addEventListener('focus', doSearch)
      searchInput.addEventListener('keydown', (e) => {
        const items = searchResults.querySelectorAll('.search-result-item')
        if (e.key === 'Escape') {
          searchInput.value = ''
          searchResults.replaceChildren()
          searchInput.blur()
          searchActiveIndex = -1
        } else if (e.key === 'ArrowDown') {
          e.preventDefault()
          if (items.length > 0) {
            searchActiveIndex = Math.min(searchActiveIndex + 1, items.length - 1)
            updateHighlight()
            items[searchActiveIndex].scrollIntoView({ block: 'nearest' })
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault()
          if (items.length > 0) {
            searchActiveIndex = Math.max(searchActiveIndex - 1, 0)
            updateHighlight()
            items[searchActiveIndex].scrollIntoView({ block: 'nearest' })
          }
        } else if (e.key === 'Enter') {
          e.preventDefault()
          if (searchActiveIndex >= 0 && searchActiveIndex < items.length) {
            const item = items[searchActiveIndex]
            const type = item.dataset.type
            const idx = parseInt(item.dataset.idx)
            if (type === 'station' && currentStations[idx]) {
              selectStation(currentStations[idx])
            } else if (type === 'location') {
              const locIdx = idx - currentStations.length
              if (currentLocations[locIdx]) selectLocation(currentLocations[locIdx])
            }
          }
        }
      })

      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
          searchResults.replaceChildren()
          searchActiveIndex = -1
        }
      })

      const tooltip = document.getElementById('spark-tooltip')

      function showSparkTooltip(e, overlay) {
        const svg = overlay.closest('svg')
        if (!svg) return
        const dataId = overlay.dataset.spark
        const data = sparklineDataMap.get(dataId)
        if (!data || data.length < 2) return

        const rect = svg.getBoundingClientRect()
        const vb = svg.viewBox.baseVal
        const scaleX = vb.width / rect.width
        const svgX = (e.clientX - rect.left) * scaleX

        const W = 240, padLeft = 28, padRight = 8, innerW = W - padLeft - padRight
        let idx = Math.round(((svgX - padLeft) / innerW) * (data.length - 1))
        idx = Math.max(0, Math.min(data.length - 1, idx))

        const pt = data[idx]
        tooltip.textContent = pt.v.toFixed(1) + ' — ' + pt.ts
        tooltip.style.display = 'block'
        tooltip.style.left = e.clientX + 'px'
        tooltip.style.top = e.clientY + 'px'
      }

      function hideSparkTooltip() {
        tooltip.style.display = 'none'
      }

      document.addEventListener('mousemove', (e) => {
        const overlay = e.target.closest('.spark-overlay')
        if (overlay) {
          showSparkTooltip(e, overlay)
        } else {
          hideSparkTooltip()
        }
      })

      // DWD enforces CORS for some reason nobody understands.
      const CORS_PROXY = isDebugSession() ? 'http://0.0.0.0:8080/' : 'https://basislager-service.onrender.com/'
      const SESSION_ID = createSessionId()

      // Restore a saved view or create a new map.
      const savedView = JSON.parse(localStorage.getItem('mapView'))
      const map = L.map('map').setView(
        savedView ? savedView.center : [47.5162, 14.5501],
        savedView ? savedView.zoom : 7
      )
      // Save view to localStorage on move or zoom
      map.on('moveend zoomend', () => {
        const center = map.getCenter()
        const zoom = map.getZoom()
        localStorage.setItem(
          'mapView',
          JSON.stringify({
            center: [center.lat, center.lng],
            zoom: zoom,
          })
        )
      })

      map.on('popupclose', hideSparkTooltip)

      // Add OSM tile layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map)

      // Create marker cluster group with custom cluster icon
      const markers = L.markerClusterGroup({
        iconCreateFunction: function (cluster) {
          const temps = cluster.getAllChildMarkers().map((m) => m.options.temp)
          const avg = (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1)
          return L.divIcon({
            html: `<div style="background: #ff7800; color: white; border-radius: 50%; padding: 10px;">${avg}°C</div>`,
            className: 'custom-cluster',
            iconSize: L.point(40, 40),
          })
        },
      })

      async function fetchStationHistory(stationId) {
        const now = new Date()
        const fourHoursAgo = new Date(now.getTime() - 4 * 60 * 60 * 1000)
        const fmt = (d) =>
          `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`

        const url =
          'https://dataset.api.hub.geosphere.at/v1/station/historical/tawes-v1-10min' +
          `?parameters=TLAM,RR&station_ids=${stationId}` +
          `&start=${fmt(fourHoursAgo)}&end=${fmt(now)}` +
          '&output_format=geojson'

        const res = await fetch(url)
        if (!res.ok) throw new Error('history fetch failed')
        const json = await res.json()

        const feature = json.features.find((f) => f.properties.station === String(stationId))
        if (!feature) return { timestamps: [], tempValues: [], precipValues: [] }

        const tempData = feature.properties.parameters.TLAM.data
        const precipData = feature.properties.parameters.RR?.data || []
        const timestamps = json.timestamps.map((t) => {
          const d = new Date(t)
          return `${pad(d.getHours())}:${pad(d.getMinutes())}`
        })

        return { timestamps, tempValues: tempData, precipValues: precipData }
      }

      function renderSparkline(containerId, timestamps, values) {
        const valid = values
          .map((v, i) => ({ ts: timestamps[i], v }))
          .filter((p) => p.v !== null)

        if (valid.length < 2) return ''

        sparklineDataMap.set(containerId, valid)

        const W = 240
        const H = 50
        const pad = { top: 8, right: 8, bottom: 16, left: 28 }
        const innerW = W - pad.left - pad.right
        const innerH = H - pad.top - pad.bottom

        const vals = valid.map((p) => p.v)
        const min = Math.min(...vals)
        const max = Math.max(...vals)
        const range = max - min || 1

        const x = (i) => pad.left + (i / (valid.length - 1)) * innerW
        const y = (v) => pad.top + innerH - ((v - min) / range) * innerH

        const points = valid.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')
        const polyline = `<polyline points="${points}" fill="none" stroke="#ff7800" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`

        const yAxis = `<line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top + innerH}" stroke="#aaa" stroke-width="1"/>`
        const maxLabel = `<text x="${pad.left - 4}" y="${pad.top + 4}" text-anchor="end" fill="#198754" font-size="9">${max.toFixed(1)}</text>`
        const minLabel = `<text x="${pad.left - 4}" y="${pad.top + innerH + 1}" text-anchor="end" fill="#dc3545" font-size="9">${min.toFixed(1)}</text>`

        const firstTs = `<text x="${pad.left}" y="${H - 4}" text-anchor="start">${valid[0].ts}</text>`
        const lastTs = `<text x="${W - pad.right}" y="${H - 4}" text-anchor="end">${valid[valid.length - 1].ts}</text>`

        const overlay = `<rect x="${pad.left}" y="${pad.top}" width="${innerW}" height="${innerH}" fill="transparent" class="spark-overlay" data-spark="${containerId}"/>`

        return `
          <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            ${yAxis}
            ${polyline}
            ${overlay}
            ${maxLabel}
            ${minLabel}
            ${firstTs}
            ${lastTs}
          </svg>`
      }

      function renderPrecipSparkline(containerId, timestamps, values) {
        const valid = values
          .map((v, i) => ({ ts: timestamps[i], v }))
          .filter((p) => p.v !== null)

        if (valid.length < 2) return ''

        sparklineDataMap.set(containerId, valid)

        const W = 240
        const H = 50
        const pad = { top: 8, right: 8, bottom: 16, left: 28 }
        const innerW = W - pad.left - pad.right
        const innerH = H - pad.top - pad.bottom

        const vals = valid.map((p) => p.v)
        const max = Math.max(...vals)
        const range = max || 1

        const barWidth = Math.max(2, innerW / valid.length - 1)
        const x = (i) => pad.left + (i / (valid.length - 1)) * innerW - barWidth / 2
        const y = (v) => pad.top + innerH - (v / range) * innerH

        const bars = valid
          .map((p, i) => {
            const bx = x(i)
            const by = y(p.v)
            const bh = pad.top + innerH - by
            return `<rect x="${bx}" y="${by}" width="${Math.max(6, barWidth)}" height="${bh}" fill="#4285f4" rx="1"/>`
          })
          .join('')

        const yAxis = `<line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top + innerH}" stroke="#aaa" stroke-width="1"/>`
        const maxLabel = `<text x="${pad.left - 4}" y="${pad.top + 4}" text-anchor="end" fill="#4285f4" font-size="9">${max.toFixed(1)}</text>`
        const zeroLabel = `<text x="${pad.left - 4}" y="${pad.top + innerH + 1}" text-anchor="end" fill="#999" font-size="9">0.0</text>`

        const firstTs = `<text x="${pad.left}" y="${H - 4}" text-anchor="start">${valid[0].ts}</text>`
        const lastTs = `<text x="${W - pad.right}" y="${H - 4}" text-anchor="end">${valid[valid.length - 1].ts}</text>`

        const overlay = `<rect x="${pad.left}" y="${pad.top}" width="${innerW}" height="${innerH}" fill="transparent" class="spark-overlay" data-spark="${containerId}"/>`

        return `
          <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            ${yAxis}
            ${bars}
            ${overlay}
            ${maxLabel}
            ${zeroLabel}
            ${firstTs}
            ${lastTs}
          </svg>`
      }

      function buildPopupContent(station) {
        const name = station.name
        const temp =
          station.temperature != null ? `<span class="current">${station.temperature.toFixed(1)}°C</span>` : '&mdash;'
        const altitude = station.altitude != null ? `${station.altitude}m` : ''

        const precip =
          station.precipitation != null
            ? `<span class="current">${station.precipitation.toFixed(1)} mm</span>`
            : '&mdash;'

        return `
          <div class="station-popup">
            <h3>${name}</h3>
            ${temp}
            ${altitude ? `<div style="font-size:11px;color:#888;">${altitude}</div>` : ''}
            <div class="sparkline" id="spark-${station.id}">
              <div style="font-size:11px;color:#aaa;padding:8px 0;">Lade Verlauf&hellip;</div>
            </div>
            <div style="font-size:12px;font-weight:600;color:#666;margin-top:8px;">Niederschlag</div>
            ${precip}
            <div class="sparkline" id="spark-prec-${station.id}">
              <div style="font-size:11px;color:#aaa;padding:8px 0;">Lade Niederschlag&hellip;</div>
            </div>
          </div>`
      }

      async function fetchAustria() {
        const stationData = {}

        const metadataResponse = await fetch(
          'https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min/metadata'
        )
        if (!metadataResponse.ok) throw new Error('connection error')
        const metadata = await metadataResponse.json()

        for (const station of metadata.stations) {
          // Some stations might be inactive.
          // TODO: Filter out stations with outdated values (e.g. more than 1 hour old).
          if (!station.is_active) continue

          stationData[station.id] = {
            name: station.name,
            altitude: station.altitude,
            lat: station.lat,
            lon: station.lon,
          }
        }

        const idsParam = encodeURIComponent(Object.keys(stationData).join(','))
        const url = `https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min?parameters=TLAM,FFAM,FFX,RR&station_ids=${idsParam}&output_format=geojson`

        const tempResponse = await fetch(url)
        if (!tempResponse.ok) throw new Error('connection error')
        const tempGeojson = await tempResponse.json()

        for (const station of tempGeojson.features) {
          const stationId = station.properties.station
          // This seems to be an array with multiple, possibly null values. Just take one for now.
          // If there is no value, then we just delete the station.
          const tempValues = station.properties.parameters.TLAM.data
          const tempValue = tempValues.filter((v) => v !== null)[0]
          if (typeof tempValue !== 'undefined') {
            stationData[stationId]['temperature'] = tempValue
          } else {
            delete stationData[stationId]
            continue
          }

          const rrValues = station.properties.parameters.RR?.data
          const rrValue = rrValues?.filter((v) => v !== null)[0]
          if (typeof rrValue !== 'undefined') {
            stationData[stationId]['precipitation'] = rrValue
          }
        }

        return stationData
      }

      function createMarkersAustria(stationData) {
        for (const [id, station] of Object.entries(stationData)) {
          station.id = id
          const marker = L.marker([station.lat, station.lon], { temp: station.temperature }).bindPopup(
            buildPopupContent(station)
          )
          if (station.temperature != null) {
            marker.bindTooltip(`${station.temperature.toFixed(1)}°C`, {
              permanent: true,
              direction: 'bottom',
              className: 'marker-temp-label',
              offset: [0, 24],
            })
          }
          registerStation(station.name, station.lat, station.lon, marker, 'AT')
          stationTempList.push({ name: station.name, temp: station.temperature, precip: station.precipitation ?? null, marker, source: 'AT' })

          marker.on('popupopen', async () => {
            const container = document.getElementById('spark-' + id)
            if (!container) return
            try {
              const { timestamps, tempValues, precipValues } = await fetchStationHistory(id)
              container.innerHTML =
                renderSparkline('spark-' + id, timestamps, tempValues) || '<span style="font-size:11px;color:#aaa;">Keine Daten</span>'
              const precipContainer = document.getElementById('spark-prec-' + id)
              if (precipContainer) {
                precipContainer.innerHTML =
                  renderPrecipSparkline('spark-prec-' + id, timestamps, precipValues) ||
                  '<span style="font-size:11px;color:#aaa;">Keine Daten</span>'
              }
            } catch {
              container.innerHTML = '<span style="font-size:11px;color:#aaa;">Fehler beim Laden</span>'
            }
          })

          markers.addLayer(marker)
        }
      }

      async function fetchSwitzerland() {
        const stationData = {}

        const metaUrl = 'https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/ogd-smn_meta_stations.csv'
        const metaResponse = await fetch(metaUrl)
        if (!metaResponse.ok) throw new Error('connection error')
        const metaBuffer = await metaResponse.arrayBuffer()
        const metaText = new TextDecoder('iso-8859-1').decode(metaBuffer)

        const metaLines = metaText.split('\n')
        const headers = metaLines[0].split(';')
        const abbrIdx = headers.indexOf('station_abbr')
        const nameIdx = headers.indexOf('station_name')
        const altIdx = headers.indexOf('station_height_masl')
        const latIdx = headers.indexOf('station_coordinates_wgs84_lat')
        const lonIdx = headers.indexOf('station_coordinates_wgs84_lon')

        const stations = []
        for (let i = 1; i < metaLines.length; i++) {
          const line = metaLines[i].trim()
          if (!line) continue
          const cols = line.split(';')
          stations.push({
            abbr: cols[abbrIdx],
            name: cols[nameIdx],
            altitude: parseFloat(cols[altIdx]) || null,
            lat: parseFloat(cols[latIdx]),
            lon: parseFloat(cols[lonIdx]),
          })
        }

        const baseUrl = 'https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/'
        const BATCH_SIZE = 64

        for (let i = 0; i < stations.length; i += BATCH_SIZE) {
          const batch = stations.slice(i, i + BATCH_SIZE)
          await Promise.allSettled(
            batch.map(async (station) => {
              try {
                const abbrLower = station.abbr.toLowerCase()
                const url = `${baseUrl}${abbrLower}/ogd-smn_${abbrLower}_t_now.csv`
                const response = await fetch(url)
                if (!response.ok) return
                const text = await response.text()
                const lines = text.split('\n')
                const dataHeaders = lines[0].split(';')
                const tempIdx = dataHeaders.indexOf('tre200s0')
                if (tempIdx < 0) return
                const precipIdx = dataHeaders.indexOf('rre150z0')
                const tsIdx = 1
                const history = []
                const precipHistory = []
                for (let j = 1; j < lines.length; j++) {
                  const cols = lines[j].split(';')
                  if (cols.length <= tempIdx) continue
                  const temp = parseFloat(cols[tempIdx].trim())
                  if (!isNaN(temp)) {
                    const tsRaw = cols[tsIdx]?.trim() || ''
                    let time = ''
                    const tsParts = tsRaw.split(' ')
                    if (tsParts.length >= 2) {
                      const dateStr = tsParts[0]
                      const timeParts = tsParts[1].split(':')
                      if (dateStr.length >= 10 && timeParts.length >= 2) {
                        const d = new Date(
                          Date.UTC(
                            dateStr.slice(6, 10),
                            dateStr.slice(3, 5) - 1,
                            dateStr.slice(0, 2),
                            timeParts[0],
                            timeParts[1]
                          )
                        )
                        time = `${pad(d.getHours())}:${pad(d.getMinutes())}`
                      }
                    }
                    history.push({ time, temp })
                    if (precipIdx >= 0) {
                      const precip = parseFloat(cols[precipIdx]?.trim())
                      if (!isNaN(precip)) {
                        precipHistory.push({ time, precip })
                      }
                    }
                  }
                }
                if (history.length > 0) {
                  const entry = {
                    name: station.name,
                    altitude: station.altitude,
                    lat: station.lat,
                    lon: station.lon,
                    temperature: history[history.length - 1].temp,
                    history,
                  }
                  if (precipHistory.length > 0) {
                    entry.precipHistory = precipHistory
                    entry.precipitation = precipHistory.slice(-24).reduce((sum, h) => sum + h.precip, 0)
                  }
                  stationData[station.abbr] = entry
                }
              } catch {
                // Skip failed stations
              }
            })
          )
        }

        return stationData
      }

      function createMarkersSwitzerland(stationData) {
        for (const [id, station] of Object.entries(stationData)) {
          station.id = id
          const cId = 'spark-ch-' + id
          const last4h = station.history.slice(-24)
          const timestamps = last4h.map((h) => h.time)
          const values = last4h.map((h) => h.temp)
          const sparkline = renderSparkline(cId, timestamps, values) || ''

          let precipHtml = ''
          if (station.precipHistory && station.precipHistory.length > 0) {
            const pId = 'spark-prec-ch-' + id
            const pLast4h = station.precipHistory.slice(-24)
            const pTimestamps = pLast4h.map((h) => h.time)
            const pValues = pLast4h.map((h) => h.precip)
            const pSparkline =
              pTimestamps.length >= 2
                ? renderPrecipSparkline(pId, pTimestamps, pValues)
                : ''
            precipHtml = `
                <div style="font-size:12px;font-weight:600;color:#666;margin-top:8px;">Niederschlag (letzte 24h)</div>
                <span class="current">${station.precipitation != null ? station.precipitation.toFixed(1) + ' mm' : '&mdash;'}</span>
                <div class="sparkline" id="${pId}">
                  ${pSparkline || '<span style="font-size:11px;color:#aaa;">Keine Daten</span>'}
                </div>`
          }

          const marker = L.marker([station.lat, station.lon], { temp: station.temperature }).bindPopup(
            `
              <div class="station-popup">
                <h3>${station.name}</h3>
                <span class="current">${station.temperature != null ? station.temperature.toFixed(1) + '°C' : '&mdash;'}</span>
                ${station.altitude != null ? `<div style="font-size:11px;color:#888;">${station.altitude}m</div>` : ''}
                <div class="sparkline" id="${cId}">
                  ${sparkline || '<span style="font-size:11px;color:#aaa;">Keine Daten</span>'}
                </div>
                ${precipHtml}
              </div>
            `
          )
          if (station.temperature != null) {
            marker.bindTooltip(`${station.temperature.toFixed(1)}°C`, {
              permanent: true,
              direction: 'bottom',
              className: 'marker-temp-label',
              offset: [0, 24],
            })
          }
          markers.addLayer(marker)
          registerStation(station.name, station.lat, station.lon, marker, 'CH')
          stationTempList.push({ name: station.name, temp: station.temperature, precip: station.precipitation ?? null, marker, source: 'CH' })
        }
      }

      async function fetchGermany() {
        const stationData = {}

        const descUrl =
          CORS_PROXY +
          'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/zehn_now_tu_Beschreibung_Stationen.txt'
        const descResponse = await fetch(descUrl, { headers: { 'Session-ID': SESSION_ID } })
        if (!descResponse.ok) throw new Error('connection error')
        const descBuffer = await descResponse.arrayBuffer()
        const descText = new TextDecoder('iso-8859-1').decode(descBuffer)

        const today = new Date().toISOString().slice(0, 10).replace(/-/g, '')
        const lines = descText.split('\n').slice(2)
        const stations = []

        for (const line of lines) {
          if (line.trim() === '') continue
          const match = line.match(
            /^(\d{5})\s+(\d{8})\s+(\d{8})\s+(-?\d+)\s+([\d.]+)\s+([\d.]+)\s+(.+?)\s{2,}(.+?)\s+Frei/
          )
          if (!match) continue
          const [, id, , bisDatum, altitude, lat, lon, name] = match
          if (bisDatum < today) continue
          stations.push({
            id,
            name: name.trim(),
            altitude: parseInt(altitude, 10),
            lat: parseFloat(lat),
            lon: parseFloat(lon),
          })
        }

        const baseUrl =
          CORS_PROXY +
          'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/'
        const BATCH_SIZE = 128

        for (let i = 0; i < stations.length; i += BATCH_SIZE) {
          const batch = stations.slice(i, i + BATCH_SIZE)
          await Promise.allSettled(
            batch.map(async (station) => {
              try {
                const response = await fetch(`${baseUrl}10minutenwerte_TU_${station.id}_now.zip`, {
                  headers: { 'Session-ID': SESSION_ID },
                })
                if (!response.ok) return
                const blob = await response.blob()
                const zip = await window.JSZip.loadAsync(blob)
                const filenames = Object.keys(zip.files).filter((f) => !f.startsWith('__MACOSX'))
                if (filenames.length === 0) return
                const content = await zip.file(filenames[0]).async('string')
                const dataLines = content.split('\n')
                const tempIdx = 4
                const tsIdx = 1
                const history = []
                for (let j = 1; j < dataLines.length; j++) {
                  const parts = dataLines[j].split(';')
                  if (parts.length < 6) continue
                  const temp = parseFloat(parts[tempIdx].trim())
                  if (!isNaN(temp) && temp !== -999) {
                    const tsRaw = parts[tsIdx]?.trim() || ''
                    let time = ''
                    if (tsRaw.length >= 12) {
                      const d = new Date(
                        Date.UTC(
                          tsRaw.slice(0, 4),
                          tsRaw.slice(4, 6) - 1,
                          tsRaw.slice(6, 8),
                          tsRaw.slice(8, 10),
                          tsRaw.slice(10, 12)
                        )
                      )
                      time = `${pad(d.getHours())}:${pad(d.getMinutes())}`
                    }
                    history.push({ time, temp })
                  }
                }
                if (history.length > 0) {
                  stationData[station.id] = {
                    name: station.name,
                    altitude: station.altitude,
                    lat: station.lat,
                    lon: station.lon,
                    temperature: history[history.length - 1].temp,
                    history,
                  }
                }
              } catch {
                // Skip failed stations
              }
            })
          )
        }

        return stationData
      }

      function createMarkersGermany(stationData) {
        for (const [id, station] of Object.entries(stationData)) {
          station.id = id
          const cId = 'spark-de-' + id
          const last4h = station.history.slice(-24)
          const timestamps = last4h.map((h) => h.time)
          const values = last4h.map((h) => h.temp)
          const sparkline = renderSparkline(cId, timestamps, values) || ''

          const marker = L.marker([station.lat, station.lon], { temp: station.temperature }).bindPopup(
            `
              <div class="station-popup">
                <h3>${station.name}</h3>
                <span class="current">${station.temperature != null ? station.temperature.toFixed(1) + '°C' : '&mdash;'}</span>
                ${station.altitude != null ? `<div style="font-size:11px;color:#888;">${station.altitude}m</div>` : ''}
                <div class="sparkline" id="${cId}">
                  ${sparkline || '<span style="font-size:11px;color:#aaa;">Keine Daten</span>'}
                </div>
              </div>
            `
          )
          if (station.temperature != null) {
            marker.bindTooltip(`${station.temperature.toFixed(1)}°C`, {
              permanent: true,
              direction: 'bottom',
              className: 'marker-temp-label',
              offset: [0, 24],
            })
          }
          markers.addLayer(marker)
          registerStation(station.name, station.lat, station.lon, marker, 'DE')
          stationTempList.push({ name: station.name, temp: station.temperature, precip: null, marker, source: 'DE' })
        }
      }

      const savedSources = JSON.parse(localStorage.getItem('weatherSources'))
      const sources = savedSources || { at: true, de: false, ch: false }
      document.getElementById('source-at').checked = sources.at
      document.getElementById('source-de').checked = sources.de
      document.getElementById('source-ch').checked = sources.ch

      document.getElementById('source-at').addEventListener('change', () => {
        sources.at = document.getElementById('source-at').checked
        localStorage.setItem('weatherSources', JSON.stringify(sources))
      })
      document.getElementById('source-de').addEventListener('change', () => {
        sources.de = document.getElementById('source-de').checked
        localStorage.setItem('weatherSources', JSON.stringify(sources))
      })
      document.getElementById('source-ch').addEventListener('change', () => {
        sources.ch = document.getElementById('source-ch').checked
        localStorage.setItem('weatherSources', JSON.stringify(sources))
      })

      async function refreshData() {
        markers.clearLayers()
        map.removeLayer(markers)
        clearStationLookup()
        clearStationTempList()

        const tasks = []
        if (sources.at) {
          tasks.push(
            fetchAustria()
              .then(createMarkersAustria)
              .catch(() => showToast('Daten für Österreich konnten nicht geladen werden'))
          )
        }
        if (sources.ch) {
          tasks.push(
            fetchSwitzerland()
              .then(createMarkersSwitzerland)
              .catch(() => showToast('Daten für Schweiz konnten nicht geladen werden'))
          )
        }
        if (sources.de) {
          tasks.push(
            fetchGermany()
              .then(createMarkersGermany)
              .catch(() => showToast('Daten für Deutschland konnten nicht geladen werden'))
          )
        }
        await Promise.allSettled(tasks)

        map.addLayer(markers)
        renderTempSidebar()
      }

      const refreshBtn = document.getElementById('refresh-btn')

      async function doRefresh() {
        refreshBtn.classList.add('spinning')
        refreshBtn.disabled = true
        try {
          await refreshData()
        } finally {
          refreshBtn.disabled = false
          refreshBtn.classList.remove('spinning')
        }
      }

      refreshBtn.addEventListener('click', doRefresh)

      document.getElementById('controls').addEventListener('dblclick', (e) => {
        e.stopPropagation()
      })

      document.getElementById('search-box').addEventListener('dblclick', (e) => {
        e.stopPropagation()
      })

      document.getElementById('temp-sidebar').addEventListener('dblclick', (e) => {
        e.stopPropagation()
      })

      doRefresh()
    </script>
  </body>
</html>
