    <div id="map">
      <div id="controls">
        <div class="d-flex gap-1">
          <input type="checkbox" class="btn-check" id="source-at" autocomplete="off" />
          <label class="btn btn-sm btn-outline-light" for="source-at">Österreich</label>
          <input type="checkbox" class="btn-check" id="source-de" autocomplete="off" />
          <label class="btn btn-sm btn-outline-light" for="source-de">Deutschland</label>
          <input type="checkbox" class="btn-check" id="source-ch" autocomplete="off" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script type="module">
      import { isDebugSession, createSessionId } from './js/common/utils.js'

      // DWD enforces CORS for some reason nobody understands.
      const CORS_PROXY = isDebugSession() ? 'http://0.0.0.0:8080/' : 'https://basislager-service.onrender.com/'
      const SESSION_ID = createSessionId()

      // Restore a saved view or create a new map.
      const savedView = JSON.parse(localStorage.getItem('mapView'))
      const map = L.map('map').setView(
        savedView ? savedView.center : [47.5162, 14.5501],
        savedView ? savedView.zoom : 7
      )
      // Save view to localStorage on move or zoom
      map.on('moveend zoomend', () => {
        const center = map.getCenter()
        const zoom = map.getZoom()
        localStorage.setItem(
          'mapView',
          JSON.stringify({
            center: [center.lat, center.lng],
            zoom: zoom,
          })
        )
      })

      // Add OSM tile layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map)

      // Create marker cluster group with custom cluster icon
      const markers = L.markerClusterGroup({
        iconCreateFunction: function (cluster) {
          const temps = cluster.getAllChildMarkers().map((m) => m.options.temp)
          const avg = (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1)
          return L.divIcon({
            html: `<div style="background: #ff7800; color: white; border-radius: 50%; padding: 10px;">${avg}°C</div>`,
            className: 'custom-cluster',
            iconSize: L.point(40, 40),
          })
        },
      })

      async function fetchAustria() {
        const stationData = {}

        const metadataResponse = await fetch(
          'https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min/metadata'
        )
        if (!metadataResponse.ok) throw new Error('connection error')
        const metadata = await metadataResponse.json()

        for (const station of metadata.stations) {
          // Some stations might be inactive.
          // TODO: Filter out stations with outdated values (e.g. more than 1 hour old).
          if (!station.is_active) continue

          stationData[station.id] = {
            name: station.name,
            altitude: station.altitude,
            lat: station.lat,
            lon: station.lon,
          }
        }

        const idsParam = encodeURIComponent(Object.keys(stationData).join(','))
        const url = `https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min?parameters=TLAM,FFAM,FFX&station_ids=${idsParam}&output_format=geojson`
        console.log(url)

        const tempResponse = await fetch(url)
        if (!tempResponse.ok) throw new Error('connection error')
        const tempGeojson = await tempResponse.json()

        for (const station of tempGeojson.features) {
          const stationId = station.properties.station
          // This seems to be an array with multiple, possibly null values. Just take one for now.
          // If there is no value, then we just delete the station.
          const tempValues = station.properties.parameters.TLAM.data
          const tempValue = tempValues.filter((v) => v !== null)[0]
          if (typeof tempValue !== 'undefined') {
            stationData[stationId]['temperature'] = tempValue
          } else {
            delete stationData[stationId]
          }
        }

        return stationData
      }

      async function fetchSwitzerland() {
        const stationData = {}

        const metaUrl = 'https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/ogd-smn_meta_stations.csv'
        const metaResponse = await fetch(metaUrl)
        if (!metaResponse.ok) throw new Error('connection error')
        const metaBuffer = await metaResponse.arrayBuffer()
        const metaText = new TextDecoder('iso-8859-1').decode(metaBuffer)

        const metaLines = metaText.split('\n')
        const headers = metaLines[0].split(';')
        const abbrIdx = headers.indexOf('station_abbr')
        const nameIdx = headers.indexOf('station_name')
        const altIdx = headers.indexOf('station_height_masl')
        const latIdx = headers.indexOf('station_coordinates_wgs84_lat')
        const lonIdx = headers.indexOf('station_coordinates_wgs84_lon')

        const stations = []
        for (let i = 1; i < metaLines.length; i++) {
          const line = metaLines[i].trim()
          if (!line) continue
          const cols = line.split(';')
          stations.push({
            abbr: cols[abbrIdx],
            name: cols[nameIdx],
            altitude: parseFloat(cols[altIdx]) || null,
            lat: parseFloat(cols[latIdx]),
            lon: parseFloat(cols[lonIdx]),
          })
        }

        const baseUrl = 'https://data.geo.admin.ch/ch.meteoschweiz.ogd-smn/'
        const BATCH_SIZE = 64

        for (let i = 0; i < stations.length; i += BATCH_SIZE) {
          const batch = stations.slice(i, i + BATCH_SIZE)
          await Promise.allSettled(
            batch.map(async (station) => {
              try {
                const abbrLower = station.abbr.toLowerCase()
                const url = `${baseUrl}${abbrLower}/ogd-smn_${abbrLower}_t_now.csv`
                const response = await fetch(url)
                if (!response.ok) return
                const text = await response.text()
                const lines = text.split('\n')
                const dataHeaders = lines[0].split(';')
                const tempIdx = dataHeaders.indexOf('tre200s0')
                if (tempIdx < 0) return
                for (let j = lines.length - 1; j >= 1; j--) {
                  const cols = lines[j].split(';')
                  if (cols.length <= tempIdx) continue
                  const temp = parseFloat(cols[tempIdx].trim())
                  if (!isNaN(temp)) {
                    stationData[station.abbr] = {
                      name: station.name,
                      altitude: station.altitude,
                      lat: station.lat,
                      lon: station.lon,
                      temperature: temp,
                    }
                    return
                  }
                }
              } catch {
                // Skip failed stations
              }
            })
          )
        }

        return stationData
      }

      function createMarkers(stationData) {
        for (const station of Object.values(stationData)) {
          const marker = L.marker([station.lat, station.lon], { temp: station.temperature }).bindPopup(
            `
              <strong>${station.name}</strong>
              <p>${station.temperature}°C</p>
            `
          )
          markers.addLayer(marker)
        }
        map.addLayer(markers)
      }

      async function fetchGermany() {
        const stationData = {}

        const descUrl =
          CORS_PROXY +
          'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/zehn_now_tu_Beschreibung_Stationen.txt'
        const descResponse = await fetch(descUrl, { headers: { 'Session-ID': SESSION_ID } })
        if (!descResponse.ok) throw new Error('connection error')
        const descBuffer = await descResponse.arrayBuffer()
        const descText = new TextDecoder('iso-8859-1').decode(descBuffer)

        const today = new Date().toISOString().slice(0, 10).replace(/-/g, '')
        const lines = descText.split('\n').slice(2)
        const stations = []

        for (const line of lines) {
          if (line.trim() === '') continue
          const match = line.match(
            /^(\d{5})\s+(\d{8})\s+(\d{8})\s+(-?\d+)\s+([\d.]+)\s+([\d.]+)\s+(.+?)\s{2,}(.+?)\s+Frei/
          )
          if (!match) continue
          const [, id, , bisDatum, altitude, lat, lon, name] = match
          if (bisDatum < today) continue
          stations.push({
            id,
            name: name.trim(),
            altitude: parseInt(altitude, 10),
            lat: parseFloat(lat),
            lon: parseFloat(lon),
          })
        }

        const baseUrl =
          CORS_PROXY +
          'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/'
        const BATCH_SIZE = 128

        for (let i = 0; i < stations.length; i += BATCH_SIZE) {
          const batch = stations.slice(i, i + BATCH_SIZE)
          await Promise.allSettled(
            batch.map(async (station) => {
              try {
                const response = await fetch(`${baseUrl}10minutenwerte_TU_${station.id}_now.zip`, {
                  headers: { 'Session-ID': SESSION_ID },
                })
                if (!response.ok) return
                const blob = await response.blob()
                const zip = await window.JSZip.loadAsync(blob)
                const filenames = Object.keys(zip.files).filter((f) => !f.startsWith('__MACOSX'))
                if (filenames.length === 0) return
                const content = await zip.file(filenames[0]).async('string')
                const dataLines = content.split('\n').slice(1)
                for (let j = dataLines.length - 1; j >= 0; j--) {
                  const parts = dataLines[j].split(';')
                  if (parts.length < 6) continue
                  const temp = parseFloat(parts[4].trim())
                  if (!isNaN(temp) && temp !== -999) {
                    stationData[station.id] = {
                      name: station.name,
                      altitude: station.altitude,
                      lat: station.lat,
                      lon: station.lon,
                      temperature: temp,
                    }
                    return
                  }
                }
              } catch {
                // Skip failed stations
              }
            })
          )
        }

        return stationData
      }

      const savedSources = JSON.parse(localStorage.getItem('weatherSources'))
      const sources = savedSources || { at: true, de: false, ch: false }
      document.getElementById('source-at').checked = sources.at
      document.getElementById('source-de').checked = sources.de
      document.getElementById('source-ch').checked = sources.ch

      document.getElementById('source-at').addEventListener('change', () => {
        sources.at = document.getElementById('source-at').checked
        localStorage.setItem('weatherSources', JSON.stringify(sources))
      })
      document.getElementById('source-de').addEventListener('change', () => {
        sources.de = document.getElementById('source-de').checked
        localStorage.setItem('weatherSources', JSON.stringify(sources))
      })
      document.getElementById('source-ch').addEventListener('change', () => {
        sources.ch = document.getElementById('source-ch').checked
        localStorage.setItem('weatherSources', JSON.stringify(sources))
      })

      async function refreshData() {
        markers.clearLayers()
        map.removeLayer(markers)

        if (sources.at) {
          try {
            const geosphereData = await fetchAustria()
            createMarkers(geosphereData)
          } catch (error) {
            console.error('Failed to load Geosphere data:', error)
          }
        }

        if (sources.ch) {
          try {
            const chData = await fetchSwitzerland()
            createMarkers(chData)
          } catch (error) {
            console.error('Failed to load Switzerland data:', error)
          }
        }

        if (sources.de) {
          try {
            const dwdData = await fetchGermany()
            createMarkers(dwdData)
          } catch (error) {
            console.error('Failed to load DWD data:', error)
          }
        }
      }

      const refreshBtn = document.getElementById('refresh-btn')

      async function doRefresh() {
        refreshBtn.classList.add('spinning')
        try {
          await refreshData()
        } finally {
          refreshBtn.classList.remove('spinning')
        }
      }

      refreshBtn.addEventListener('click', doRefresh)

      doRefresh()
    </script>
