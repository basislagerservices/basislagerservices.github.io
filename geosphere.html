    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
      // Restore a saved view or create a new map.
      const savedView = JSON.parse(localStorage.getItem('geosphereMapView'))
      const map = L.map('map').setView(
        savedView ? savedView.center : [47.5162, 14.5501],
        savedView ? savedView.zoom : 7
      )
      map.on('moveend zoomend', () => {
        const center = map.getCenter()
        const zoom = map.getZoom()
        localStorage.setItem(
          'geosphereMapView',
          JSON.stringify({
            center: [center.lat, center.lng],
            zoom: zoom,
          })
        )
      })

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map)

      const markers = L.layerGroup().addTo(map)

      async function fetchAustria() {
        const stationData = {}

        const metadataResponse = await fetch(
          'https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min/metadata'
        )
        if (!metadataResponse.ok) throw new Error('connection error')
        const metadata = await metadataResponse.json()

        for (const station of metadata.stations) {
          if (!station.is_active) continue

          stationData[station.id] = {
            name: station.name,
            altitude: station.altitude,
            lat: station.lat,
            lon: station.lon,
          }
        }

        const idsParam = encodeURIComponent(Object.keys(stationData).join(','))
        const url = `https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min?parameters=TLAM,FFAM,FFX&station_ids=${idsParam}&output_format=geojson`

        const tempResponse = await fetch(url)
        if (!tempResponse.ok) throw new Error('connection error')
        const tempGeojson = await tempResponse.json()

        for (const station of tempGeojson.features) {
          const stationId = station.properties.station
          const tempValues = station.properties.parameters.TLAM.data
          const tempValue = tempValues.filter((v) => v !== null)[0]
          if (typeof tempValue !== 'undefined') {
            stationData[stationId]['temperature'] = tempValue
          } else {
            delete stationData[stationId]
          }
        }

        return stationData
      }

      async function fetchStationHistory(stationId) {
        const now = new Date()
        const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000)
        const pad = (n) => String(n).padStart(2, '0')
        const fmt = (d) =>
          `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`

        const url =
          'https://dataset.api.hub.geosphere.at/v1/station/historical/tawes-v1-10min' +
          `?parameters=TLAM&station_ids=${stationId}` +
          `&start=${fmt(oneHourAgo)}&end=${fmt(now)}` +
          '&output_format=geojson'

        const res = await fetch(url)
        if (!res.ok) throw new Error('history fetch failed')
        const json = await res.json()

        const feature = json.features.find((f) => f.properties.station === String(stationId))
        if (!feature) return { timestamps: [], values: [] }

        const data = feature.properties.parameters.TLAM.data
        const timestamps = json.timestamps.map((t) => {
          const d = new Date(t)
          return `${pad(d.getHours())}:${pad(d.getMinutes())}`
        })

        return { timestamps, values: data }
      }

      function renderSparkline(timestamps, values) {
        const valid = values
          .map((v, i) => ({ ts: timestamps[i], v }))
          .filter((p) => p.v !== null)

        if (valid.length < 2) return ''

        const W = 240
        const H = 50
        const pad = { top: 8, right: 8, bottom: 16, left: 8 }
        const innerW = W - pad.left - pad.right
        const innerH = H - pad.top - pad.bottom

        const vals = valid.map((p) => p.v)
        const min = Math.min(...vals)
        const max = Math.max(...vals)
        const range = max - min || 1

        const x = (i) => pad.left + (i / (valid.length - 1)) * innerW
        const y = (v) => pad.top + innerH - ((v - min) / range) * innerH

        const points = valid.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')
        const polyline = `<polyline points="${points}" fill="none" stroke="#ff7800" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`

        const last = valid[valid.length - 1]
        const lastLabel = `<text x="${W - pad.right}" y="${pad.top - 1}" text-anchor="end" fill="#ff7800" font-weight="bold">${last.v.toFixed(1)}°</text>`

        const firstTs = `<text x="${pad.left}" y="${H - 4}" text-anchor="start">${valid[0].ts}</text>`
        const lastTs = `<text x="${W - pad.right}" y="${H - 4}" text-anchor="end">${valid[valid.length - 1].ts}</text>`

        return `
          <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            ${polyline}
            ${lastLabel}
            ${firstTs}
            ${lastTs}
          </svg>`
      }

      function buildPopupContent(station) {
        const name = station.name
        const temp =
          station.temperature != null ? `<span class="current">${station.temperature.toFixed(1)}°C</span>` : '&mdash;'
        const altitude = station.altitude != null ? `${station.altitude}m` : ''

        return `
          <div class="station-popup">
            <h3>${name}</h3>
            ${temp}
            ${altitude ? `<div style="font-size:11px;color:#888;">${altitude}</div>` : ''}
            <div class="sparkline" id="spark-${station.id}">
              <div style="font-size:11px;color:#aaa;padding:8px 0;">Lade Verlauf&hellip;</div>
            </div>
          </div>`
      }

      async function refreshData() {
        markers.clearLayers()

        try {
          const data = await fetchAustria()
          for (const [id, station] of Object.entries(data)) {
            station.id = id
            const marker = L.marker([station.lat, station.lon]).bindPopup(buildPopupContent(station))

            marker.on('popupopen', async () => {
              const container = document.getElementById('spark-' + id)
              if (!container) return
              try {
                const { timestamps, values } = await fetchStationHistory(id)
                container.innerHTML = renderSparkline(timestamps, values) || '<span style="font-size:11px;color:#aaa;">Keine Daten</span>'
              } catch {
                container.innerHTML = '<span style="font-size:11px;color:#aaa;">Fehler beim Laden</span>'
              }
            })

            marker.addTo(markers)
          }
        } catch (error) {
          console.error('Failed to load Geosphere data:', error)
        }
      }

      refreshData()
    </script>
